<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Upload File(s)</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <button id="theme-toggle" aria-label="Toggle dark mode">🌙 Toggle Dark Mode</button>
        {{if .Error}}
        <div style="color:red;">{{.Error}}</div>
        {{end}}
        <h3>Single File Upload</h3>
        <form method="post" enctype="multipart/form-data" action="/upload/singleupload">
            File <input type="file" name="file"/>
            <input type="submit" value="Upload"/>
        </form>
        <br>
        <h3>Multi-file Upload</h3>
        <form method="post" enctype="multipart/form-data" action="/upload/multiupload">
            File <input type="file" name="files" multiple="multiple"/>
            <input type="submit" value="Upload"/>
        </form>
        <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        document.getElementById('theme-toggle').onclick = function() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? '' : 'dark');
        };
        </script>
    </body>
</html>
